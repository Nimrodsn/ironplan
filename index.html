<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תוכנית ברזל</title>
<meta name="description" content="בונה תוכנית אימונים שבועית לפי מספר האימונים בשבוע, עם סרטון הדגמה לכל תרגיל.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E9EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תוכנית ברזל">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--HEAD-REST-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Cairo:wght@400;600;800&family=Noto+Sans:wght@400;600;700&display=swap">

<style>
:root{
  --bg:#E7E9EC;
  --surface:#FCFCFD;
  --surface-2:#F0F2F4;
  --ink:#12161B;
  --ink-2:#5A6470;
  --ink-3:#8C959F;
  --line:#D2D7DE;
  --line-strong:#B9C0C9;
  --btn-bg:#12161B;
  --btn-ink:#FCFCFD;

  --c-chest:#CE3A2C;
  --c-back:#1F5FBF;
  --c-legs:#C2810E;
  --c-shoulders:#17845C;
  --c-arms:#7C4BC0;
  --c-core:#566270;

  --day:var(--c-chest);

  --f-display:"Karantina","Cairo","Noto Sans","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Cairo","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;

  --r:10px;
  --shadow:0 1px 2px rgba(18,22,27,.06), 0 8px 24px -12px rgba(18,22,27,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317;
    --surface:#191D23;
    --surface-2:#22272E;
    --ink:#E9ECF0;
    --ink-2:#98A2AE;
    --ink-3:#6E7884;
    --line:#2A3038;
    --line-strong:#3A424C;
    --btn-bg:#E9ECF0;
    --btn-ink:#12161B;

    --c-chest:#FF5B49;
    --c-back:#5D9BF5;
    --c-legs:#EDAE3C;
    --c-shoulders:#2FB981;
    --c-arms:#A87BEF;
    --c-core:#8A97A6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#101317;
  --surface:#191D23;
  --surface-2:#22272E;
  --ink:#E9ECF0;
  --ink-2:#98A2AE;
  --ink-3:#6E7884;
  --line:#2A3038;
  --line-strong:#3A424C;
  --btn-bg:#E9ECF0;
  --btn-ink:#12161B;

  --c-chest:#FF5B49;
  --c-back:#5D9BF5;
  --c-legs:#EDAE3C;
  --c-shoulders:#2FB981;
  --c-arms:#A87BEF;
  --c-core:#8A97A6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1040px;margin:0 auto;padding:28px 20px 64px}

/* ---------- header ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{display:block;flex:none}
.brand h1{
  font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.82;
  margin:0;letter-spacing:.01em;text-wrap:balance;
}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.masthead-actions{display:flex;gap:8px;flex-wrap:wrap}

button{font:inherit;color:inherit;cursor:pointer}
.btn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  padding:8px 14px;font-size:13.5px;font-weight:600;
  transition:border-color .15s,background .15s,transform .1s;
}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn-solid{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn-solid:hover{opacity:.88;border-color:var(--btn-bg)}
:focus-visible{outline:2.5px solid var(--day);outline-offset:2px;border-radius:4px}

/* ---------- language ---------- */
.lang{padding-top:34px}
.lang-list{
  list-style:none;margin:26px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.lang-opt{
  width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;
  transition:border-color .15s,box-shadow .15s;
}
.lang-opt:hover{border-color:var(--line-strong)}
.lang-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.lang-native{font-size:19px;font-weight:700;line-height:1.2}
.lang-en{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.lang-chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  padding:8px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .15s;
}
.lang-chip:hover{border-color:var(--ink-2)}
.lang-chip svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;flex:none}

/* ---------- place ---------- */
.place{padding-top:34px}
.place-list{
  list-style:none;margin:26px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.place-opt{
  width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:7px;
  transition:border-color .15s,box-shadow .15s;
}
.place-opt:hover{border-color:var(--line-strong)}
.place-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.place-opt svg{width:30px;height:30px;stroke:var(--ink-3);stroke-width:1.6;fill:none;transition:stroke .15s}
.place-opt[aria-pressed="true"] svg{stroke:var(--ink)}
.place-t{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:.9}
.place-d{color:var(--ink-2);font-size:13.5px}
.place-gear{
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.03em;
  border-top:1px solid var(--line);padding-top:8px;margin-top:2px;
}

/* ---------- setup ---------- */
.setup,.intro{padding-top:34px}
.intro .setup-lead h2{font-size:48px}
.setup-lead{max-width:60ch}
.setup-lead h2{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:.95;margin:0 0 6px;text-wrap:balance}
.setup-lead p{margin:0;color:var(--ink-2);font-size:15px}
.how{
  list-style:none;margin:28px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
}
.how li{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:3px}
.how-n{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:.85;color:var(--ink-3)}
.how-t{font-size:15.5px;font-weight:700}
.how-d{color:var(--ink-2);font-size:13.5px}
.backlink{
  background:none;border:none;padding:0;margin:0 0 16px;
  color:var(--ink-2);font-size:13.5px;font-weight:600;
}
.backlink::before{content:"→ "}
.app[dir="ltr"] .backlink::before{content:"← "}
.backlink:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
#planView .backlink{margin:0 0 2px}
.freq-list{display:flex;flex-direction:column;gap:10px;margin:26px 0 0;padding:0;list-style:none}
.freq{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;transition:border-color .15s,box-shadow .15s;
}
.freq:hover{border-color:var(--line-strong)}
.freq[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.freq-num{
  font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.8;
  width:52px;text-align:center;color:var(--ink-3);transition:color .15s;
}
.freq[aria-pressed="true"] .freq-num{color:var(--ink)}
.freq-name{display:block;font-weight:700;font-size:17px;line-height:1.3}
.freq-desc{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4}
.freq-dots{display:flex;gap:4px}
.freq-dots i{width:9px;height:22px;border-radius:2px;background:var(--line-strong);display:block}
.freq-dots i[data-on]{background:var(--dot)}
.setup-preview{
  margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  padding:16px 18px;
}
.setup-preview h3{
  margin:0 0 12px;font-size:11.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);
}
.preview-days{display:flex;flex-wrap:wrap;gap:8px}
.preview-day{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:6px 11px 6px 8px;font-size:13.5px;font-weight:600;
}
.preview-day b{width:4px;height:18px;border-radius:2px;background:var(--pc);display:block}
.preview-day span{color:var(--ink-2);font-weight:400;font-family:var(--f-mono);font-size:11.5px}
.setup-cta{margin-top:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.setup-cta .btn-solid{padding:11px 26px;font-size:15px}
.fineprint{color:var(--ink-3);font-size:12.5px;max-width:52ch}

/* ---------- week strip ---------- */
.week{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:24px 0 0;
}
.daybtn{
  background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;
  padding:0 4px 10px;text-align:center;position:relative;transition:border-color .15s;
}
.daybtn::before{content:"";display:block;height:5px;margin:0 -4px 9px;background:var(--pc);border-radius:2px 2px 0 0}
.daybtn.rest::before{background:var(--line-strong)}
.daybtn:hover{border-color:var(--line-strong)}
.daybtn[aria-pressed="true"]{border-color:var(--pc);box-shadow:var(--shadow)}
.daybtn .dow{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;display:block}
.daybtn .glabel{
  display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.daybtn.rest .glabel,.daybtn.rest .dow{color:var(--ink-3)}
.daybtn .prog{
  display:block;margin:6px auto 0;height:3px;width:70%;border-radius:2px;background:var(--line);overflow:hidden;
}
.daybtn .prog i{display:block;height:100%;background:var(--pc);border-radius:2px;transition:width .25s}

/* ---------- day card ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-top:16px;overflow:hidden;
}
.card-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--day)}
.card-head h2{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:.9;margin:4px 0 6px}
.card-head .sub{color:var(--ink-2);font-size:13.5px;margin:0}
.meta{display:flex;gap:20px;flex-wrap:wrap}
.meta div{text-align:start}
.meta dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0}
.meta dd{margin:2px 0 0;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

.warm{
  display:flex;gap:9px;align-items:baseline;padding:11px 20px;background:var(--surface-2);
  border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2);
}
.warm b{color:var(--ink);font-weight:700;white-space:nowrap}

/* ---------- exercises ---------- */
.ex-list{list-style:none;margin:0;padding:0}
.ex{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto auto;
  grid-template-areas:"n name presc act" ". cue cue cue";
  align-items:center;column-gap:14px;row-gap:4px;
  padding:14px 20px;border-bottom:1px solid var(--line);
}
.ex:last-child{border-bottom:none}
.ex.done .ex-he{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.ex.done .ex-en,.ex.done .cue{color:var(--ink-3)}
.tick{grid-area:n;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);
  background:transparent;display:grid;place-items:center;padding:0;transition:.15s}
.tick:hover{border-color:var(--day)}
.tick svg{width:14px;height:14px;stroke:var(--btn-ink);stroke-width:2.6;fill:none;opacity:0}
.ex.done .tick{background:var(--day);border-color:var(--day)}
.ex.done .tick svg{opacity:1;stroke:#fff}
:root[data-theme="dark"] .ex.done .tick svg{stroke:#101317}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex.done .tick svg{stroke:#101317}}

.ex-name{grid-area:name;min-width:0}
.ex-he{font-weight:700;font-size:15.5px;display:block}
.ex-en{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.cue{grid-area:cue;color:var(--ink-2);font-size:13px;padding-inline-end:8px}
.cue::before{content:"";display:inline-block;width:14px;height:1px;background:var(--line-strong);
  vertical-align:middle;margin-inline-end:7px}
.presc{grid-area:presc;display:flex;gap:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.presc b{font-size:15px;font-weight:600;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.presc .rest{font-size:13px;color:var(--ink-2);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.presc .rest::before{content:"⟳ ";font-family:var(--f-body)}
.act{grid-area:act;display:flex;gap:6px;align-items:center}
.vid{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;
  border:1px solid var(--line-strong);border-radius:7px;padding:5px 10px 5px 8px;
  font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s;
}
.vid:hover{border-color:var(--day);color:var(--day)}
.vid svg{width:13px;height:13px;fill:currentColor;flex:none}
.swap{border:1px solid var(--line-strong);background:transparent;border-radius:7px;
  width:30px;height:28px;display:grid;place-items:center;padding:0;transition:.15s}
.swap:hover{border-color:var(--day);color:var(--day)}
.swap svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}

/* ---------- rest day ---------- */
.restday{padding:30px 20px 34px;text-align:center}
.restday h2{font-family:var(--f-display);font-weight:700;font-size:40px;margin:0 0 8px;line-height:.9}
.restday p{margin:0 auto;max-width:46ch;color:var(--ink-2)}

/* ---------- volume ---------- */
.volume{margin-top:26px;border-top:2px solid var(--ink);padding-top:18px}
.volume h3{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0 0 2px;line-height:1}
.volume > p{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:74px 1fr 62px;align-items:center;gap:12px;font-size:13.5px}
.bar .bname{font-weight:600}
.bar .track{height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--bc);border-radius:2px;transition:width .3s}
.bar .bval{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

footer.note{margin-top:28px;color:var(--ink-3);font-size:12.5px;max-width:70ch}

@media (max-width:720px){
  .app{padding:20px 14px 48px}
  .brand h1{font-size:42px}
  .setup-lead h2{font-size:32px}
  .intro .setup-lead h2{font-size:36px}
  .how{grid-template-columns:1fr;gap:16px}
  .lang-list{grid-template-columns:repeat(2,1fr);gap:8px}
  .place-list{grid-template-columns:1fr;gap:10px}
  .place-opt{padding:16px}
  .place-t{font-size:26px}
  .lang-opt{padding:12px 13px}
  .lang-native{font-size:17px}
  .freq{grid-template-columns:auto 1fr;gap:12px}
  .freq-dots{display:none}
  .week{grid-template-columns:repeat(7,1fr);gap:3px}
  .daybtn{padding:0 2px 8px}
  .daybtn .dow{font-size:19px}
  .daybtn .glabel{font-size:9.5px}
  .card-head h2{font-size:30px}
  .ex{grid-template-columns:30px minmax(0,1fr);
      grid-template-areas:"n name" ". presc" ". cue" ". act";row-gap:7px}
  .presc{gap:12px}
  .bar{grid-template-columns:66px 1fr 54px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== התאמות לאפליקציה בנייד ===== */
html{-webkit-text-size-adjust:100%}
body{
  min-height:100dvh;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
.app{
  padding-top:max(20px, env(safe-area-inset-top));
  padding-inline:max(14px, env(safe-area-inset-left));
  padding-bottom:max(48px, env(safe-area-inset-bottom));
}
.week{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding-top:8px;
  margin-top:16px;
}
.tick,.swap,.vid{touch-action:manipulation}
@media (max-width:720px){
  .tick{width:30px;height:30px}
  .swap{width:36px;height:32px}
  .vid{padding:7px 12px 7px 10px;font-size:13px}
  .ex{padding:15px 14px}
  .card-head,.restday{padding-inline:16px}
  .warm{padding-inline:16px}
  .freq{padding:13px 14px}
}

/* כפתור התקנה */
.install{
  display:none;align-items:center;gap:7px;
  background:var(--btn-bg);color:var(--btn-ink);border:1px solid var(--btn-bg);
  border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:700;
}
.install[data-show]{display:inline-flex}
.install svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}

/* גיליון הסבר להתקנה באייפון */
.sheet{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(10,12,15,.55);padding:18px;
  align-items:flex-end;justify-content:center;
}
.sheet[data-open]{display:flex}
.sheet-inner{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:420px;
  box-shadow:var(--shadow);
}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0 0 10px;line-height:1}
.sheet ol{margin:0 0 16px;padding-inline-start:20px;color:var(--ink-2);font-size:14px}
.sheet li{margin-bottom:6px}
.sheet li b{color:var(--ink)}
.offline-note{
  display:flex;gap:8px;align-items:baseline;margin-top:14px;
  font-size:12.5px;color:var(--ink-3);
}
</style>
</head>
<body>

<div class="app" dir="rtl">
  <header class="masthead">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="15" width="32" height="4" rx="1" fill="currentColor"/>
        <rect x="5" y="10" width="4" height="14" rx="1.2" fill="currentColor"/>

/*LANG-DATA*/

/* ================== מצב ================== */
const KEY='iron-plan-v1';
const DEF={freq:3,seed:1,sel:0,done:{},swaps:{},screen:'lang',lang:null,place:null};
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return {...DEF};
    return Object.assign({...DEF}, JSON.parse(raw));
  }catch(e){ return {...DEF}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ================== עזרים ================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffled(arr,seedStr){
  const rnd=mulberry32(hash(seedStr));
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function timer(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function vidUrl(en){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(en+' proper form technique');}

/* ---- גישה לתרגום הנוכחי ---- */
function L(){ return T[state.lang] || T.he; }
function U(){ return L().ui; }
function fill(str,vals){ return String(str).replace(/\{(\w+)\}/g,(m,k)=>(k in vals?vals[k]:m)); }
function exName(en){ const e=L().ex[en]; return e?e[0]:en; }
function exCue(en){ const e=L().ex[en]; return e?e[1]:''; }
function repsText(e){
  const u=U();
  if(e.fail) return u.toFailure;
  let s=e.r;
  if(e.sec) s+=' '+u.secUnit;
  if(e.leg) s+=' '+u.perLeg;
  return s;
}
function langDef(code){ return LANGS.find(l=>l.code===code) || LANGS[0]; }

/* מחיל את השפה הנבחרת על כל הטקסטים הקבועים ועל כיווניות העמוד */
function applyLang(){
  const u=U(), def=langDef(state.lang);
  document.documentElement.lang=def.code;
  document.documentElement.dir=def.dir;
  document.querySelector('.app').setAttribute('dir',def.dir);
  document.title=u.brand;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=u[el.dataset.i18n];
    if(typeof v==='string') el.textContent=v;
  });
  document.getElementById('week').setAttribute('aria-label',u.weekAria);
  document.getElementById('langChipLabel').textContent=def.native;
  document.getElementById('placeChipLabel').textContent = state.place==='home' ? u.homeT : u.gymT;
  renderLangList();
  renderPlaceList();
}

function renderPlaceList(){
  document.getElementById('optGym').setAttribute('aria-pressed', String(state.place==='gym'));
  document.getElementById('optHome').setAttribute('aria-pressed', String(state.place==='home'));
}

/* החלפת מקום האימון מחליפה את מאגר התרגילים, ולכן הסימונים
   וההחלפות הישנות כבר לא מתאימות לתוכנית החדשה */
function setPlace(p){
  if(state.place!==p){
    state.place=p; state.done={}; state.swaps={};
  }
  save(); applyLang();
  go(state.screen==='place' ? 'intro' : state.screen);
}

function renderLangList(){
  const list=document.getElementById('langList');
  list.innerHTML='';
  LANGS.forEach(l=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.className='lang-opt'; b.type='button';
    b.setAttribute('aria-pressed', String(l.code===state.lang));
    b.setAttribute('dir', l.dir);
    b.innerHTML=`<span class="lang-native">${l.native}</span><span class="lang-en">${l.en}</span>`;
    b.addEventListener('click',()=>{
      state.lang=l.code; save(); applyLang();
      go(state.screen==='lang' ? (state.place ? 'intro' : 'place') : state.screen);
    });
    li.appendChild(b); list.appendChild(li);
  });
}

/* בונה את רשימת התרגילים ליום מסוים */
/* מאגר התרגילים לפי מקום האימון */
function bank(g){ return state.place==='home' ? EX_HOME[g] : EX[g]; }

function buildDay(dayIdx){
  const def = SPLITS[state.freq].days[dayIdx];
  const out = [];
  def.recipe.forEach(([g,n])=>{
    const order = shuffled(bank(g), `${state.seed}|${state.place}|${state.freq}|${dayIdx}|${g}`);
    const picks = order.slice(0,n).map(e=>({...e, g}));
    for(let i=0;i<picks.length;i++){
      const off = state.swaps[`${state.place}-${state.freq}-${dayIdx}-${out.length+i}`]||0;
      if(!off) continue;
      const used = new Set(picks.filter((_,j)=>j!==i).map(x=>x.en));
      const cand = order.filter(x=>!used.has(x.en));
      const base = cand.findIndex(x=>x.en===picks[i].en);
      picks[i] = {...cand[(base+off)%cand.length], g};
    }
    out.push(...picks);
  });
  return out;
}
function wholePlan(){
  return SPLITS[state.freq].days.map((d,i)=>({def:d, ex:buildDay(i)}));
}
/* מפה: אינדקס יום בשבוע -> אינדקס אימון */
function slotMap(){
  const m={};
  SPLITS[state.freq].slots.forEach((wd,i)=>{m[wd]=i;});
  return m;
}
function doneSet(dayIdx){
  const k=`${state.place}-${state.freq}-${dayIdx}`;
  return new Set(state.done[k]||[]);
}
function toggleDone(dayIdx,en){
  const k=`${state.place}-${state.freq}-${dayIdx}`;
  const s=new Set(state.done[k]||[]);
  s.has(en)?s.delete(en):s.add(en);
  state.done[k]=[...s];
  save();
}

/* ================== מסך בחירה ================== */
const freqList=document.getElementById('freqList');
const preview=document.getElementById('preview');
let setupPick=state.freq;

function renderSetup(){
  const u=U(), t=L();
  freqList.innerHTML='';
  for(let n=2;n<=6;n++){
    const sp=SPLITS[n], meta=t.sp[n];
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.className='freq';
    b.type='button';
    b.setAttribute('aria-pressed', String(n===setupPick));
    b.innerHTML=`
      <span class="freq-num">${n}</span>
      <span>
        <span class="freq-name">${meta.name}</span>
        <span class="freq-desc">${meta.desc}</span>
      </span>
      <span class="freq-dots" aria-hidden="true">${
        Array.from({length:7},(_,i)=>{
          const idx=sp.slots.indexOf(i);
          if(idx<0) return '<i></i>';
          return `<i data-on style="--dot:${G[sp.days[idx].color]}"></i>`;
        }).join('')
      }</span>`;
    b.addEventListener('click',()=>{setupPick=n;renderSetup();});
    li.appendChild(b);
    freqList.appendChild(li);
  }
  const sp=SPLITS[setupPick], meta=t.sp[setupPick];
  preview.innerHTML=meta.days.map((d,i)=>
    `<span class="preview-day" style="--pc:${G[sp.days[i].color]}"><b></b>${d.title}<span>${u.dowFull[sp.slots[i]]}</span></span>`
  ).join('') + `<span class="preview-day" style="--pc:var(--line-strong)"><b></b>${u.restLabel}<span>${fill(u.restCount,{n:7-setupPick})}</span></span>`;
}

/* מעבר בין המסכים. push=false כשהמעבר מגיע מכפתור החזרה של הדפדפן,
   כדי לא לדחוף עוד רשומה להיסטוריה על כל חזרה. */
function go(screen,push){
  if(screen==='setup'){ setupPick=state.freq; renderSetup(); }
  state.screen=screen;
  save();
  if(push!==false){ try{ history.pushState({screen:screen},''); }catch(e){} }
  route();
}

document.getElementById('btnStart').addEventListener('click',()=>go('setup'));
document.getElementById('btnToLang').addEventListener('click',()=>go('lang'));
document.getElementById('btnLangChip').addEventListener('click',()=>go('lang'));
document.getElementById('btnToPlace').addEventListener('click',()=>go('place'));
document.getElementById('btnPlaceChip').addEventListener('click',()=>go('place'));
document.getElementById('optGym').addEventListener('click',()=>setPlace('gym'));
document.getElementById('optHome').addEventListener('click',()=>setPlace('home'));
document.getElementById('btnIntro').addEventListener('click',()=>go('intro'));
document.getElementById('btnToSetup').addEventListener('click',()=>go('setup'));
document.getElementById('btnBuild').addEventListener('click',()=>{
  if(setupPick!==state.freq){ state.sel=SPLITS[setupPick].slots[0]; }
  state.freq=setupPick;
  go('plan');
});

window.addEventListener('popstate',(e)=>{
  go((e.state&&e.state.screen)||'lang', false);
});
document.getElementById('btnShuffle').addEventListener('click',()=>{
  state.seed++; state.swaps={}; state.done={}; save(); renderPlan();
});
document.getElementById('btnReset').addEventListener('click',()=>{
  state.done={}; save(); renderPlan();
});

/* ================== מסך התוכנית ================== */
const weekEl=document.getElementById('week');
const cardEl=document.getElementById('dayCard');
const barsEl=document.getElementById('bars');

function renderPlan(){
  const sp=SPLITS[state.freq];
  const u=U(), meta=L().sp[state.freq];
  const map=slotMap();
  const plan=wholePlan();

  document.getElementById('brandSub').textContent=
    fill(u.freqSub,{n:state.freq,split:meta.name})+' · '+(state.place==='home'?u.homeT:u.gymT);

  /* רצועת השבוע */
  weekEl.innerHTML='';
  for(let wd=0;wd<7;wd++){
    const di=map[wd];
    const isTrain=di!==undefined;
    const b=document.createElement('button');
    b.type='button';
    b.className='daybtn'+(isTrain?'':' rest');
    b.setAttribute('aria-pressed',String(wd===state.sel));
    let pct=0;
    if(isTrain){
      const list=plan[di].ex, d=doneSet(di);
      pct=Math.round(list.filter(e=>d.has(e.en)).length/list.length*100);
    }
    const col=isTrain?G[sp.days[di].color]:'var(--line-strong)';
    b.style.setProperty('--pc',col);
    b.innerHTML=`<span class="dow">${u.dow[wd]}</span>
      <span class="glabel">${isTrain?meta.days[di].title:u.restLabel}</span>
      <span class="prog"><i style="width:${pct}%"></i></span>`;
    b.addEventListener('click',()=>{state.sel=wd;save();renderPlan();});
    weekEl.appendChild(b);
  }

  /* כרטיס היום */
  const di=map[state.sel];
  const dayName=u.dowFull[state.sel];
  if(di===undefined){
    cardEl.style.setProperty('--day','var(--ink-3)');
    cardEl.innerHTML=`<div class="restday">
      <h2>${fill(u.restTitle,{day:dayName})}</h2>
      <p>${u.restText}</p>
    </div>`;
  }else{
    const day=plan[di], dayMeta=meta.days[di], col=G[day.def.color];
    const d=doneSet(di);
    const totalSets=day.ex.reduce((a,e)=>a+e.s,0);
    const mins=Math.round(day.ex.reduce((a,e)=>a+e.s*(e.t+45),0)/60)+8;
    cardEl.style.setProperty('--day',col);
    cardEl.innerHTML=`
      <div class="card-head">
        <div>
          <div class="eyebrow">${fill(u.dayLine,{day:dayName,i:di+1,n:state.freq})}</div>
          <h2>${dayMeta.title}</h2>
          <p class="sub">${dayMeta.focus}</p>
        </div>
        <dl class="meta">
          <div><dt>${u.mExercises}</dt><dd>${day.ex.length}</dd></div>
          <div><dt>${u.mSets}</dt><dd>${totalSets}</dd></div>
          <div><dt>${u.mDuration}</dt><dd>${mins}′</dd></div>
          <div><dt>${u.mDone}</dt><dd>${day.ex.filter(e=>d.has(e.en)).length}/${day.ex.length}</dd></div>
        </dl>
      </div>
      <div class="warm"><b>${u.warmup}</b><span>${state.place==='home'?L().warmHome[day.def.color]:dayMeta.warm}</span></div>
      <ul class="ex-list">${day.ex.map((e,i)=>{
        const nm=exName(e.en);
        return `
        <li class="ex${d.has(e.en)?' done':''}">
          <button class="tick" type="button" data-tick="${i}" aria-pressed="${d.has(e.en)}" aria-label="${fill(u.doneAria,{x:nm})}">
            <svg viewBox="0 0 16 16" aria-hidden="true"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>
          </button>
          <span class="ex-name">
            <span class="ex-he">${nm}</span>
            <span class="ex-en">${L().g[e.g]} · <bdi>${e.en}</bdi></span>
          </span>
          <span class="presc">
            <b>${e.s}×${repsText(e)}</b>
            <span class="rest">${timer(e.t)}</span>
          </span>
          <span class="act">
            <a class="vid" href="${vidUrl(e.en)}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>${u.video}
            </a>
            <button class="swap" type="button" data-swap="${i}" title="${u.swapTitle}" aria-label="${fill(u.swapAria,{x:nm})}">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h11l-3-3M14 11H3l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </span>
          <span class="cue">${exCue(e.en)}</span>
        </li>`;}).join('')}</ul>`;

    cardEl.querySelectorAll('[data-tick]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        toggleDone(di, day.ex[+btn.dataset.tick].en);
        renderPlan();
      });
    });
    cardEl.querySelectorAll('[data-swap]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const slot=+btn.dataset.swap;
        const k=`${state.freq}-${di}-${slot}`;
        state.swaps[k]=(state.swaps[k]||0)+1;
        save(); renderPlan();
      });
    });
  }

  /* נפח שבועי */
  const vol={};
  plan.forEach(day=>day.ex.forEach(e=>{
    const key = (e.g==='biceps'||e.g==='triceps') ? 'arms' : e.g;
    vol[key]=(vol[key]||0)+e.s;
  }));
  const g=L().g;
  const NAMES={chest:g.chest,back:g.back,legs:g.legs,shoulders:g.shoulders,arms:u.arms,core:g.core};
  const COLS={chest:'var(--c-chest)',back:'var(--c-back)',legs:'var(--c-legs)',
              shoulders:'var(--c-shoulders)',arms:'var(--c-arms)',core:'var(--c-core)'};
  const max=Math.max(...Object.values(vol),1);
  barsEl.innerHTML=Object.keys(NAMES).map(k=>{
    const v=vol[k]||0;
    return `<div class="bar" style="--bc:${COLS[k]}">
      <span class="bname">${NAMES[k]}</span>
      <span class="track"><span class="fill" style="width:${Math.round(v/max*100)}%"></span></span>
      <span class="bval">${v} ${u.setsUnit}</span>
    </div>`;
  }).join('');
}

function route(){
  if(!state.lang) state.screen='lang';
  else if(!state.place && state.screen!=='lang') state.screen='place';
  const s=state.screen;
  document.getElementById('lang').hidden     = s!=='lang';
  document.getElementById('place').hidden    = s!=='place';
  document.getElementById('intro').hidden    = s!=='intro';
  document.getElementById('setup').hidden    = s!=='setup';
  document.getElementById('planView').hidden = s!=='plan';
  document.getElementById('planActions').hidden = s!=='plan';
  document.getElementById('btnLangChip').hidden = s==='lang';
  document.getElementById('btnPlaceChip').hidden = s==='lang' || s==='place' || !state.place;
  if(s==='plan'){
    renderPlan();
  }else{
    document.getElementById('brandSub').textContent=U().tagline;
  }
  window.scrollTo({top:0,behavior:'auto'});
}

applyLang();
renderSetup();
route();
try{ history.replaceState({screen:state.screen},''); }catch(e){}

/* ================== התקנה כאפליקציה ================== */
const btnInstall=document.getElementById('btnInstall');
const sheet=document.getElementById('sheet');
const sheetSteps=document.getElementById('sheetSteps');
let deferredPrompt=null;

const isStandalone = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isAndroid = /Android/.test(ua);

function installSteps(){
  const u=U();
  return isIOS ? u.iosSteps : isAndroid ? u.androidSteps : u.desktopSteps;
}

/* בתוך iframe (למשל בתצוגת ארטיפקט) אי אפשר להתקין — אז אין טעם בכפתור */
const inFrame = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
if(!isStandalone && !inFrame){
  btnInstall.setAttribute('data-show','');
}
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  btnInstall.setAttribute('data-show','');
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;
  btnInstall.removeAttribute('data-show');
});
btnInstall.addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    return;
  }
  sheetSteps.innerHTML = installSteps().map(s=>`<li>${s}</li>`).join('');
  sheet.setAttribute('data-open','');
});
document.getElementById('sheetClose').addEventListener('click',()=>sheet.removeAttribute('data-open'));
sheet.addEventListener('click',(e)=>{ if(e.target===sheet) sheet.removeAttribute('data-open'); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') sheet.removeAttribute('data-open'); });

/* ================== עבודה במצב לא מקוון ================== */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
